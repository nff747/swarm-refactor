[project]
name = "swarm-refactor"
version = "0.1.0"
description = "Autonomous multi-agent orchestrator utilizing the Actor Model for self-learning, iterative code refactoring and sandboxed test-driven verification."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "iKi", email = "180210171+nff747@users.noreply.github.com" }
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
swarm-refactor = "swarm_refactor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
